<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11151c">
<meta name="robots" content="noindex">
<title>サービス管理</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --text: #1b1f27; --muted: #667085; --line: #e3e6eb;
  --accent: #2f6fed; --ok: #1a9a5b; --warn: #c27c0e; --bad: #d1423f; --off: #c3c8d0;
  --pill-ok: #e3f5ec; --pill-warn: #fbf0dc; --pill-bad: #fbe6e5; --pill-off: #eef0f3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151c; --card: #1a2029; --text: #e7eaf0; --muted: #98a2b3; --line: #2a313c;
    --accent: #5b8ff9; --ok: #3cc47c; --warn: #e3a33a; --bad: #f06a66; --off: #4a525e;
    --pill-ok: #173828; --pill-warn: #3a2f17; --pill-bad: #3d1f1f; --pill-off: #252c36;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 560px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
#connection { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
#connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
#connection.online::before { background: var(--ok); }
#connection.offline::before { background: var(--bad); }
#notice {
  display: none; background: var(--pill-bad); color: var(--text); border-radius: 12px;
  padding: 12px 14px; font-size: 14px; line-height: 1.6; margin-bottom: 14px;
}
#notice.show { display: block; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center;
}
.name { font-size: 17px; font-weight: 600; }
.meta { grid-column: 1 / 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.pill { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--pill-off); color: var(--muted); }
.pill.running { background: var(--pill-ok); color: var(--ok); }
.pill.starting, .pill.stopping, .pill.partial { background: var(--pill-warn); color: var(--warn); }
.pill.error { background: var(--pill-bad); color: var(--bad); }
.error { grid-column: 1 / -1; font-size: 13px; color: var(--bad); line-height: 1.5; }
.card a { color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 600; }
.switch { grid-row: 1 / 3; grid-column: 2; position: relative; width: 60px; height: 34px; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch input:disabled { cursor: wait; }
.track { position: absolute; inset: 0; border-radius: 999px; background: var(--off); transition: background .2s; }
.track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
}
.switch input:checked + .track { background: var(--ok); }
.switch input:checked + .track::after { transform: translateX(26px); }
.switch input:disabled + .track { opacity: .55; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.busy .track::after { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
details { margin-top: 20px; font-size: 14px; color: var(--muted); }
summary { cursor: pointer; padding: 6px 0; }
.setting { display: flex; gap: 8px; margin-top: 8px; }
.setting input {
  flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); font-size: 14px;
}
.setting button {
  padding: 10px 16px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
}
footer { margin-top: 8px; font-size: 12px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>サービス管理</h1>
    <span id="connection">確認中</span>
  </header>
  <div id="notice"></div>
  <section id="services"></section>
  <details id="settings">
    <summary>接続先の設定</summary>
    <div class="setting">
      <input id="api" type="url" inputmode="url" placeholder="https://<PC名>.<tailnet>.ts.net:11443" autocomplete="off">
      <button id="save" type="button">保存</button>
    </div>
  </details>
  <footer id="updated"></footer>
</main>
<script>
const STATE_LABELS = {
  running: "稼働中", stopped: "停止中", starting: "起動中…", stopping: "停止中…", partial: "一部のみ稼働", error: "エラー"
};
const servedByHub = location.port === "5010" || location.port === "11443";
const storage = {
  get() { try { return localStorage.getItem("hubApi") || ""; } catch { return ""; } },
  set(value) { try { localStorage.setItem("hubApi", value); } catch {} }
};
const hashApi = new URLSearchParams(location.hash.slice(1)).get("api");
if (hashApi) storage.set(hashApi.replace(/\/+$/, ""));
let apiBase = servedByHub ? "" : storage.get();
let pending = {};
let timer = null;
let lastData = null;

const $ = (id) => document.getElementById(id);
$("api").value = apiBase;
if (servedByHub) $("settings").hidden = true;
$("save").addEventListener("click", () => {
  apiBase = $("api").value.trim().replace(/\/+$/, "");
  storage.set(apiBase);
  refresh();
});

async function request(path, options = {}, timeout = 8000) {
  const controller = new AbortController();
  const stop = setTimeout(() => controller.abort(), timeout);
  try {
    const response = await fetch(apiBase + path, { ...options, signal: controller.signal, cache: "no-store" });
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
    return body;
  } finally {
    clearTimeout(stop);
  }
}

function setConnection(online, text) {
  $("connection").className = online ? "online" : "offline";
  $("connection").textContent = text;
}

function showNotice(text) {
  $("notice").textContent = text;
  $("notice").classList.toggle("show", Boolean(text));
}

function render(data) {
  const container = $("services");
  for (const service of data.services) {
    let card = container.querySelector(`[data-id="${service.id}"]`);
    if (!card) {
      card = document.createElement("article");
      card.className = "card";
      card.dataset.id = service.id;
      card.innerHTML = `
        <div class="name"></div>
        <label class="switch"><input type="checkbox" role="switch"><span class="track"></span></label>
        <div class="meta"><span class="pill"></span><span class="detail"></span><a target="_blank" rel="noopener">開く</a></div>
        <div class="error" hidden></div>`;
      card.querySelector("input").addEventListener("change", (event) => toggle(service.id, event.target));
      container.append(card);
    }
    const busy = service.state === "starting" || service.state === "stopping" || pending[service.id];
    const input = card.querySelector("input");
    card.querySelector(".name").textContent = service.name;
    input.setAttribute("aria-label", `${service.name}を${service.on ? "停止" : "起動"}`);
    if (!pending[service.id]) input.checked = service.state === "starting" ? true : service.state === "stopping" ? false : service.on;
    input.disabled = Boolean(busy);
    card.querySelector(".switch").classList.toggle("busy", Boolean(busy));
    const pill = card.querySelector(".pill");
    pill.className = "pill " + service.state;
    pill.textContent = STATE_LABELS[service.state] || service.state;
    card.querySelector(".detail").textContent = (service.details || []).filter(Boolean).join(" / ");
    const link = card.querySelector("a");
    link.href = service.url;
    link.hidden = service.state !== "running";
    const error = card.querySelector(".error");
    error.hidden = !service.error;
    error.textContent = service.error ? "前回の操作に失敗しました: " + service.error : "";
  }
}

async function refresh() {
  clearTimeout(timer);
  if (!servedByHub && !apiBase) {
    setConnection(false, "未設定");
    showNotice("接続先が未設定です。下の「接続先の設定」に PC の管理サーバーの URL を入力してください。");
    $("settings").open = true;
    return;
  }
  let delay = 5000;
  try {
    const data = await request("/api/status");
    lastData = data;
    setConnection(true, "PC接続中");
    showNotice("");
    render(data);
    $("updated").textContent = "最終更新 " + new Date().toLocaleTimeString("ja-JP");
    if (data.services.some((service) => service.state === "starting" || service.state === "stopping")) delay = 2000;
  } catch (error) {
    setConnection(false, "PCに接続できません");
    showNotice("PCに接続できません。PCの電源が入っているか、このスマホの Tailscale がオンになっているかを確認してください。");
    $("services").querySelectorAll("input").forEach((input) => { input.disabled = true; });
    delay = 10000;
  }
  timer = setTimeout(refresh, delay);
}

async function toggle(id, input) {
  const service = lastData?.services.find((item) => item.id === id);
  const action = input.checked ? "start" : "stop";
  if (action === "stop" && !confirm(`${service?.name || id} を停止しますか？\n処理中の作業があれば中断されます。`)) {
    input.checked = true;
    return;
  }
  pending[id] = true;
  input.disabled = true;
  try {
    await request(`/api/services/${id}/${action}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Hub-Client": "1" },
      body: "{}"
    });
  } catch (error) {
    input.checked = action === "stop";
    alert("操作できませんでした: " + error.message);
  } finally {
    delete pending[id];
    refresh();
  }
}

document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
